  <circle cx="200" cy="348" r="5" fill="#94A3B8" />
  <circle cx="260" cy="348" r="5" fill="#94A3B8" />
  <circle cx="320" cy="348" r="5" fill="#94A3B8" />
  <circle cx="380" cy="348" r="5" fill="#94A3B8" />
  <circle cx="440" cy="348" r="5" fill="#94A3B8" />
