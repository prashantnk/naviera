name: temporal-hooks

on:
  schedule:
    # Runs every 14 minutes to execute overdue appointment & stale e-way-bill checks
    # and keep the Render Free instance warm (within the 750 h/month free allowance).
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-temporal-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger temporal hooks iteration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NAVIERA_API_URL: ${{ secrets.NAVIERA_API_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ] || [ -z "${NAVIERA_API_URL}" ]; then
            echo "CRON_SECRET and NAVIERA_API_URL repository secrets must be configured." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 60 \
            -w "\nHTTP %{http_code}\n" \
            -X POST \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${NAVIERA_API_URL%/}/api/v1/internal/temporal-hooks/run"
