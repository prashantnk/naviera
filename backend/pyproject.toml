[tool.poetry]
name = "naviera-backend"
version = "0.1.0"
description = "Naviera backend (FastAPI API service)"
authors = [
    "Prashant Ranjan <prashantnk2001@gmail.com>"
]
readme = "README.md"
packages = [{include = "app"}] 

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.133.0,<1.0.0"
starlette = ">=1.0.1,<2.0.0"
uvicorn = {extras = ["standard"], version = ">=0.37.0,<1.0.0"}
sqlmodel = ">=0.0.27,<0.0.28"
asyncpg = ">=0.30.0,<0.31.0"
alembic = ">=1.17.0,<2.0.0"
python-dotenv = ">=1.1.1,<2.0.0"
pyjwt = ">=2.10.1,<3.0.0"
passlib = {extras = ["bcrypt"], version = ">=1.7.4,<2.0.0"}
httpx = ">=0.28.1,<1.0.0"
pydantic-settings = "^2.11.0"
logfire = {extras = ["fastapi"], version = ">=5.5.0,<6.0.0"}
pydantic = {extras = ["email"], version = "^2.12.5"}
reportlab = "^4.4.10"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=1.2.0,<2.0.0"
black = ">=26.10.1,<27.0.0"
ruff = ">=0.14.0,<1.0.0"
isort = ">=7.0.0,<10.0.0"
pre-commit = ">=4.3.0,<5.0.0"
supabase = "^2.22.0"
aiosqlite = "^0.22.1"
hypothesis = ">=6.170.0,<7.0.0"
pip-audit = ">=2.7.3"

[tool.poetry.group.e2e]
optional = true

[tool.poetry.group.e2e.dependencies]
# UI golden layer (backend/scripts/tests/ui_golden): attaches over CDP to Chrome :9224, no browser download.
pytest-playwright = "^0.7"
pypdf = ">=6.21.4,<8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
seed = "scripts.seed:main_wrapper"

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "I", "B007", "T201", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# setup_logging() must run before importing app routers so Logfire auto-tracing hooks imports
"app/main.py" = ["E402"]
# Alembic env.py kept byte-identical to origin/master
"alembic/env.py" = ["I001", "T201", "PLC0415"]
# CLI/ops/test scripts intentionally print progress and reports to stdout
"scripts/**" = ["T201"]
[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --assert=plain"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
